<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>03 The hard problem</title>
    <link rel="stylesheet" href="lib/style.css" />
  </head>
  <body>
    <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
    <script type="module">
      import { mount, svg, place, prog, kf, ease, lerp } from './lib/anim.js';
      import { C } from './lib/palette.js';
      import { loadTimings, backdrop, label, programWindow, meter, arrow, machine, verdict, proofCard } from './lib/parts.js';

      const T = await loadTimings('03-hard-problem');
      const stage = document.getElementById('stage');
      const bg = backdrop(stage);

      // ---- Cues, taken from the narration timings --------------------------
      const tChanges = T.word(1, 'changes itself');
      const tKnow = T.word(1, 'how does it know');
      const tTasks = T.L(2);
      const tHelps = T.word(2, 'helps with one task');
      const tBreak = T.word(2, 'can break another');
      const tToday = T.word(2, 'A change that helps today');
      const tLater = T.word(2, 'can make every later');
      const tDamage = T.L(3);
      const tPart = T.word(3, 'the part of itself');
      const tHit = tPart + 1.2;
      const tNoWay = T.word(3, 'it may have no way');
      const tTwo = T.L(4);
      const tProve = T.word(4, 'You can prove it');
      const tBefore = T.word(4, 'before making');
      const tOr = T.word(4, 'Or you can make');
      const tMeasure = T.word(4, 'and measure');
      const tThree = T.L(5);
      const tEach = T.word(5, 'Each one is');

      // ---- Sound cues, for the soundtrack mixer ---------------------------
      const sfx = [];
      const fx = (t, type, extra = {}) => sfx.push({ t: Math.round(t * 1000) / 1000, type, ...extra });
      fx(0.15, 'pop');
      fx(tChanges - 0.3, 'swoosh', { dur: 1.0 });
      fx(tChanges + 0.5, 'tick', { pitch: 0.7 });
      fx(tChanges + 0.9, 'rise', { dur: 0.6 });
      fx(tKnow - 0.1, 'whoosh');
      fx(tKnow + 0.4, 'blip', { pitch: 0.9 });
      fx(tTasks - 0.2, 'whoosh');
      [0, 1, 2].forEach((i) => fx(tTasks + 0.1 + i * 0.12, 'pop', { pitch: 1 + i * 0.1, gain: 0.6 }));
      fx(tHelps, 'rise', { dur: 0.6 });
      fx(tBreak, 'blip', { pitch: 0.5 });
      fx(tToday - 0.2, 'whoosh');
      fx(tToday + 0.2, 'rise', { dur: 0.5 });
      [0, 1, 2, 3].forEach((i) => fx(tLater + i * 0.3, 'pop', { pitch: 0.9 - i * 0.1 }));
      fx(tDamage - 0.2, 'whoosh');
      fx(tDamage + 0.2, 'blip', { pitch: 1.3, gain: 0.6 });
      fx(tPart + 0.4, 'swoosh', { dur: 0.8 });
      fx(tHit, 'blip', { pitch: 0.4 });
      fx(tNoWay, 'swoosh', { dur: 0.5, gain: 0.6 });
      fx(tNoWay + 0.8, 'swoosh', { dur: 0.5, gain: 0.5 });
      fx(tNoWay + 1.0, 'blip', { pitch: 0.45 });
      fx(tTwo - 0.3, 'whoosh');
      fx(tProve - 0.2, 'pop');
      [0, 1, 2, 3].forEach((i) => fx(tProve + 0.3 + i * 0.35, 'tick', { pitch: 1 + i * 0.08 }));
      fx(tProve + 1.8, 'chime', { pitch: 1.2, gain: 0.5, dur: 1.0 });
      fx(tBefore, 'swoosh', { dur: 0.5 });
      fx(tOr - 0.2, 'pop', { pitch: 1.15 });
      fx(tOr + 0.9, 'rise', { dur: 0.5 });
      fx(tMeasure - 0.2, 'swoosh', { dur: 0.5 });
      [0, 1, 2, 3, 4].forEach((i) => fx(tMeasure + 0.1 + i * 0.15, 'tick', { pitch: i === 2 ? 0.6 : 1.2 }));
      fx(tThree - 0.3, 'whoosh');
      [0, 1, 2].forEach((i) => fx(tThree + 0.2 + i * 0.45, 'pop', { pitch: 1 + i * 0.15 }));
      fx(tEach - 0.3, 'chime', { pitch: 0.9 });
      [0, 1, 2].forEach((i) => fx(tEach + 0.3 + i * 0.25, 'swoosh', { dur: 0.6, gain: 0.6 }));

      // ---- The program that changes itself ----------------------------------
      const ROWS = [
        { indent: 0, w: 430, color: C.sky }, { indent: 0, w: 300, color: C.violet }, { indent: 1, w: 380, color: C.mist },
        { indent: 1, w: 460, color: C.mist }, { indent: 0, w: 340, color: C.mist }, { indent: 0, w: 220, color: C.sky },
      ];
      const WIN = { w: 900, h: 560, header: 78, top: 56, rowGap: 62, barH: 24, pad: 110, indentW: 72 };
      const win = programWindow(stage, { ...WIN, rows: ROWS });
      const boxAt = { x: win.L + 40, y: win.rowY(1) - 17, width: WIN.w - 80, height: 2 * WIN.rowGap + WIN.barH + 34, rx: 18, 'stroke-width': 3, opacity: 0 };
      const partBox = svg('rect', { ...boxAt, fill: C.amber, 'fill-opacity': 0.12, stroke: C.amber }, win.g);
      const hurtBox = svg('rect', { ...boxAt, fill: C.coral, 'fill-opacity': 0.14, stroke: C.coral }, win.g);
      const newLine = svg('rect', { x: win.rowX(1), y: win.rowY(2), height: WIN.barH, rx: WIN.barH / 2, fill: C.amber, width: 0 }, win.g);
      const selfArrow = arrow(win.g, 'M 462 30 C 660 30 680 -440 380 -440 C 230 -440 160 -400 150 -306', { color: C.amber, width: 9, head: 24 });
      const LOOP = `M 462 ${win.rowY(1) + 12} C 640 ${win.rowY(1) + 12} 640 ${win.rowY(3) + 12} 472 ${win.rowY(3) + 12}`;
      const dmgArrow = arrow(win.g, LOOP, { color: C.amber, width: 9, head: 24 });
      const fixArrow = arrow(win.g, LOOP, { color: C.coral, width: 9, head: 24 });
      // The damaged line, in pieces.
      const PIECES = [[0, 92, -5, -6], [112, 80, 6, 5], [214, 112, -3, -4], [348, 84, 7, 8]];
      const pieces = PIECES.map(([x, w, dy, rot]) => {
        const g = svg('g', {}, win.g);
        svg('rect', { x: -w / 2, y: -WIN.barH / 2, width: w, height: WIN.barH, rx: WIN.barH / 2, fill: C.coral }, g);
        return { g, x: win.rowX(1) + x + w / 2, y: win.rowY(3) + WIN.barH / 2, dy, rot };
      });

      // ---- "How does it know?" ----------------------------------------------
      const RX = 1040;
      const ask = svg('g', {}, stage);
      label(ask, 'Is the change an improvement?', { x: RX, y: 390, size: 48, weight: 700 });
      const before = meter(ask, { w: 600, h: 30, text: 'before the change', color: C.mist });
      before.g.setAttribute('transform', `translate(${RX} 500)`);
      before.set(0.5);
      const after = meter(ask, { w: 600, h: 30, text: 'after the change', color: C.amber });
      after.g.setAttribute('transform', `translate(${RX} 640)`);
      const unsure = label(ask, '?', { y: 669, size: 46, weight: 700, fill: C.amber });

      // ---- One change, three tasks ------------------------------------------
      const tasks = svg('g', {}, stage);
      label(tasks, 'one change, tried on three tasks', { x: RX, y: 350, size: 34, weight: 500, fill: C.mist });
      const taskRows = [0, 1, 2].map((i) => {
        const y = 460 + i * 120;
        label(tasks, `task ${i + 1}`, { x: RX, y: y + 12, size: 36 });
        const m = meter(tasks, { w: 400, h: 28 });
        m.g.setAttribute('transform', `translate(${RX + 160} ${y - 14})`);
        const v = verdict(tasks);
        place(v.g, { x: RX + 630, y });
        return { m, v };
      });

      // ---- Each later change takes more work --------------------------------
      const later = svg('g', {}, stage);
      const BASE = 780;
      const HEIGHTS = [90, 150, 215, 285, 360];
      label(later, 'work needed to make each change', { x: RX, y: 350, size: 34, weight: 500, fill: C.mist });
      svg('rect', { x: RX, y: BASE, width: 700, height: 5, rx: 2.5, fill: C.slate }, later);
      const bars = HEIGHTS.map((h, i) =>
        svg('rect', { x: RX + 30 + i * 130, width: 84, rx: 14, fill: i === 0 ? C.mint : C.coral }, later));
      const todayLabel = label(later, 'today', { x: RX + 72, y: BASE + 52, size: 30, fill: C.mint, anchor: 'middle' });
      const laterLabel = label(later, 'later changes', { x: RX + 397, y: BASE + 52, size: 30, fill: C.coral, anchor: 'middle' });

      // ---- The part that makes the changes ----------------------------------
      const LX = 1410;
      const partLabel = svg('g', {}, stage);
      label(partLabel, 'the part that', { x: LX, y: 488, size: 34, fill: C.amber });
      label(partLabel, 'makes the changes', { x: LX, y: 532, size: 34, fill: C.amber });
      const noWay = svg('g', {}, stage);
      label(noWay, 'no way to repair', { x: LX, y: 650, size: 36, weight: 700, fill: C.coral });
      label(noWay, 'the damage', { x: LX, y: 694, size: 36, weight: 700, fill: C.coral });

      // ---- Two ways to find out ---------------------------------------------
      const twoWays = label(stage, 'Two ways to find out whether a change is good', { x: 960, y: 190, size: 50, weight: 700, anchor: 'middle' });
      const MINI = [
        { indent: 0, w: 430, color: C.sky }, { indent: 0, w: 300, color: C.violet }, { indent: 1, w: 420, color: C.amber },
        { indent: 1, w: 460, color: C.mist }, { indent: 0, w: 340, color: C.mist }, { indent: 0, w: 220, color: C.sky },
      ];
      function way(color, heading, programX, arrowFrom, notes) {
        const g = svg('g', {}, stage);
        svg('rect', { x: -380, y: -260, width: 760, height: 520, rx: 36, fill: C.ink700, 'fill-opacity': 0.9, stroke: color, 'stroke-width': 4 }, g);
        label(g, heading, { y: -176, size: 46, weight: 700, fill: color, anchor: 'middle' });
        const program = programWindow(g, { ...WIN, rows: MINI, title: '' });
        const link = arrow(g, `M ${arrowFrom} 30 L ${arrowFrom + 90} 30`, { color: C.mist, width: 7, head: 18 });
        const noteEls = notes.map(([x, str]) => label(g, str, { x, y: 216, size: 30, weight: 500, fill: C.mist, anchor: 'middle' }));
        return { g, program, programX, link, noteEls };
      }
      const prove = way(C.violet, 'Prove it first', 215, -20, [[-190, 'the proof'], [215, 'the change']]);
      const proof = proofCard(prove.g);
      place(proof.g, { x: -190, y: 30 });
      const measure = way(C.mint, 'Change it, then measure', -215, -70, [[-215, 'the change'], [190, 'what happens']]);
      const RESULTS = [1, 1, 0, 1, 1];
      const results = RESULTS.map(() => verdict(measure.g, { r: 22 }));
      const score = meter(measure.g, { w: 248, h: 22 });
      score.g.setAttribute('transform', 'translate(66 58)');

      // ---- Three machines, three answers ------------------------------------
      const NAMES = [['Gödel Machine', '2003', C.violet], ['Darwin Gödel Machine', '2025', C.mint], ['Huxley-Gödel Machine', '2025', C.sky]];
      const NX = [400, 960, 1520];
      const question = label(stage, 'How does it know that a change is an improvement?', { x: 960, y: 190, size: 46, anchor: 'middle' });
      const trio = NAMES.map(([name, when, color], i) => {
        const g = svg('g', {}, stage);
        machine(g, { size: 240, color });
        label(g, name, { y: 210, size: 44, weight: 700, anchor: 'middle' });
        label(g, when, { y: 264, size: 32, weight: 500, fill: C.mist, anchor: 'middle' });
        const from = 960 + (i - 1) * 60;
        const d = i === 1 ? 'M 960 232 L 960 340' : `M ${from} 232 C ${from} 290 ${NX[i]} 270 ${NX[i]} 340`;
        return { g, answer: arrow(stage, d, { color, width: 7, head: 20 }) };
      });

      const DURATION = T.duration;
      const show = (el, o) => el.setAttribute('opacity', o.toFixed(3));

      function render(t) {
        bg(T.offset + t);

        // -- the program: where it sits in each shot
        const pop = prog(t, 0.15, 0.7, ease.outBack);
        const wx = kf(t, [[tKnow - 0.1, 960], [tKnow + 0.7, 520], [tDamage - 0.2, 520], [tDamage + 0.6, 760]]);
        const ws = kf(t, [[tKnow - 0.1, 0.9], [tKnow + 0.7, 0.72], [tDamage - 0.2, 0.72], [tDamage + 0.6, 0.95]]);
        place(win.g, { x: wx, y: 560 + lerp(40, 0, pop), s: ws * pop, o: prog(t, 0.15, 0.3) * (1 - prog(t, tTwo - 0.35, 0.4)) });

        // -- it changes one of its own lines
        selfArrow.draw(prog(t, tChanges - 0.3, 1.0, ease.inOut), 1 - prog(t, tKnow - 0.3, 0.4));
        win.lines[2].set(1 - prog(t, tChanges + 0.5, 0.4, ease.inOut));
        newLine.setAttribute('width', (420 * prog(t, tChanges + 0.9, 0.6, ease.inOut)).toFixed(2));

        // -- is the changed program better? it cannot tell
        show(ask, prog(t, tKnow + 0.4, 0.4) * (1 - prog(t, tTasks - 0.35, 0.3)));
        const level = 0.5 + 0.3 * Math.sin((t - tKnow) * 2.2);
        after.set(level);
        unsure.setAttribute('x', (RX + 600 * level + 18).toFixed(1));

        // -- helps one task, breaks another
        show(tasks, prog(t, tTasks, 0.4) * (1 - prog(t, tToday - 0.35, 0.3)));
        const broke = prog(t, tBreak, 0.5, ease.inOut);
        taskRows[0].m.set(lerp(0.55, 0.92, prog(t, tHelps, 0.6, ease.inOut)));
        taskRows[1].m.set(lerp(0.6, 0.08, broke));
        taskRows[1].m.fill.setAttribute('fill', broke > 0.5 ? C.coral : C.mint);
        taskRows[2].m.set(0.5);
        taskRows.forEach((r, i) => r.v.set(i === 1 ? 1 - prog(t, tBreak + 0.15, 0.2) : 1));

        // -- helps today, makes every later change harder
        show(later, prog(t, tToday - 0.1, 0.4) * (1 - prog(t, tDamage - 0.35, 0.3)));
        bars.forEach((bar, i) => {
          const h = HEIGHTS[i] * prog(t, i === 0 ? tToday + 0.2 : tLater + (i - 1) * 0.3, 0.5);
          bar.setAttribute('y', (BASE - h).toFixed(2));
          bar.setAttribute('height', h.toFixed(2));
        });
        show(todayLabel, prog(t, tToday + 0.2, 0.3));
        show(laterLabel, prog(t, tLater, 0.3));

        // -- it damages the part of itself that makes the changes
        const gone = 1 - prog(t, tTwo - 0.35, 0.4);
        const hit = prog(t, tHit, 0.35, ease.outBack);
        show(partBox, prog(t, tDamage + 0.2, 0.35));
        show(hurtBox, prog(t, tHit, 0.3));
        show(partLabel, prog(t, tDamage + 0.5, 0.4) * gone);
        dmgArrow.draw(prog(t, tPart + 0.4, 0.8, ease.inOut), 1 - prog(t, tHit + 0.3, 0.4));
        win.lines[3].set(t < tHit ? 1 : 0);
        pieces.forEach((p) => place(p.g, { x: p.x, y: p.y + p.dy * hit, r: p.rot * hit, o: t < tHit ? 0 : 1 }));

        // -- and then cannot repair itself
        fixArrow.draw(kf(t, [[tNoWay, 0], [tNoWay + 0.5, 0.5, ease.out], [tNoWay + 0.9, 0, ease.in], [tNoWay + 1.3, 0.38, ease.out], [tNoWay + 1.7, 0, ease.in]]));
        show(noWay, prog(t, tNoWay + 0.9, 0.4) * gone);

        // -- two ways to find out: prove first, or change and measure
        const waysOff = 1 - prog(t, tThree - 0.35, 0.4);
        show(twoWays, prog(t, tTwo + 0.2, 0.5) * waysOff);
        const proveIn = prog(t, tProve - 0.2, 0.6, ease.outBack);
        place(prove.g, { x: 500, y: 620 + lerp(40, 0, proveIn), s: lerp(0.9, 1, proveIn), o: prog(t, tProve - 0.2, 0.3) * waysOff });
        proof.lines.forEach((ln, i) => ln.set(prog(t, tProve + 0.3 + i * 0.35, 0.35)));
        show(proof.qed, prog(t, tProve + 1.8, 0.3));
        prove.link.draw(prog(t, tBefore, 0.4, ease.inOut));
        const made = prog(t, tBefore + 0.35, 0.5, ease.outBack);
        place(prove.program.g, { x: prove.programX, y: 30, s: 0.3 * made, o: prog(t, tBefore + 0.35, 0.2) });
        prove.program.lines[2].set(prog(t, tBefore + 0.8, 0.5, ease.inOut));
        show(prove.noteEls[0], prog(t, tProve + 0.4, 0.4));
        show(prove.noteEls[1], prog(t, tBefore + 0.5, 0.4));

        const measureIn = prog(t, tOr - 0.2, 0.6, ease.outBack);
        place(measure.g, { x: 1420, y: 620 + lerp(40, 0, measureIn), s: lerp(0.9, 1, measureIn), o: prog(t, tOr - 0.2, 0.3) * waysOff });
        const changed = prog(t, tOr + 0.3, 0.5, ease.outBack);
        place(measure.program.g, { x: measure.programX, y: 30, s: 0.3 * changed, o: prog(t, tOr + 0.3, 0.2) });
        measure.program.lines[2].set(prog(t, tOr + 0.9, 0.5, ease.inOut));
        measure.link.draw(prog(t, tMeasure - 0.2, 0.4, ease.inOut));
        results.forEach((v, i) => {
          v.set(RESULTS[i]);
          place(v.g, { x: 66 + i * 62, y: -4, s: prog(t, tMeasure + 0.1 + i * 0.15, 0.35, ease.outBack) });
        });
        show(score.g, prog(t, tMeasure + 0.5, 0.3));
        score.set(0.8 * prog(t, tMeasure + 0.6, 0.6));
        show(measure.noteEls[0], prog(t, tOr + 0.5, 0.4));
        show(measure.noteEls[1], prog(t, tMeasure + 0.2, 0.4));

        // -- three machines, each a different answer to the question
        show(question, prog(t, tEach - 0.3, 0.5));
        trio.forEach((m, i) => {
          const t0 = tThree + 0.2 + i * 0.45;
          const p = prog(t, t0, 0.6, ease.outBack);
          const a0 = tEach + 0.3 + i * 0.25;
          const nod = 1 + 0.06 * Math.sin(prog(t, a0 + 0.5, 0.5, ease.linear) * Math.PI);
          place(m.g, { x: NX[i], y: 500 + lerp(40, 0, p), s: p * nod, o: prog(t, t0, 0.25) });
          m.answer.draw(prog(t, a0, 0.6, ease.inOut));
        });
      }

      mount({ duration: DURATION, render, sfx });
    </script>
  </body>
</html>
