<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>02 An old idea</title>
    <link rel="stylesheet" href="lib/style.css" />
  </head>
  <body>
    <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
    <script type="module">
      import { mount, svg, place, prog, kf, ease, lerp } from './lib/anim.js';
      import { C } from './lib/palette.js';
      import { loadTimings, backdrop, label, meter, arrow, chip, person, machine, paperCard } from './lib/parts.js';

      const T = await loadTimings('02-old-idea');
      const stage = document.getElementById('stage');
      const bg = backdrop(stage);

      // ---- Cues, taken from the narration timings --------------------------
      const tOld = T.L(1);
      const tYear = T.word(1, 'In 1965');
      const tGood = T.word(1, 'the mathematician');
      const tImagined = T.word(1, 'imagined a machine');
      const tSurpass = T.word(1, 'that could beat');
      const tEvery = T.word(1, 'at every kind');
      const tDesigning = T.L(2);
      const tSo = T.word(2, 'So, Good reasoned');
      const tBetter = T.word(2, 'design even better');
      const tWrote = T.L(3);
      const tExplosion = T.word(3, 'an intelligence explosion');
      const tBehind = T.word(3, 'and human intelligence');
      const tLast = T.L(4);
      const tInvention = T.word(4, 'the last invention');
      const tNeed = T.word(4, 'humans would ever');
      const tCond = T.word(4, 'But he attached');
      const tObey = T.word(4, 'The machine would have');
      const tTell = T.word(4, 'to tell us');
      const tBut = T.L(5);
      const tHard = T.word(5, 'And there is a hard problem');

      const ACTS = ['mathematics', 'science', 'writing', 'medicine', 'designing machines'];
      const stepA = (tEvery - tSurpass + 0.8) / ACTS.length; // gap between the machine passing each activity
      const STEPS = [tSo + 0.7, tBetter - 0.2, tBetter + 0.9]; // when each machine designs the next

      // ---- Sound cues, for the soundtrack mixer ---------------------------
      const sfx = [];
      const fx = (t, type, extra = {}) => sfx.push({ t: Math.round(t * 1000) / 1000, type, ...extra });
      fx(0.1, 'swoosh', { dur: 0.9 });
      for (let i = 0; i < 6; i++) fx(tOld + 0.4 + (i * (tYear - tOld - 0.6)) / 6, 'tick', { pitch: 1.3 - i * 0.08, gain: 0.6 });
      fx(tYear, 'chime', { pitch: 0.8 });
      fx(tGood - 0.25, 'whoosh');
      fx(tGood, 'pop');
      fx(tGood + 0.4, 'pop', { pitch: 1.2 });
      fx(tImagined - 0.3, 'whoosh');
      fx(tImagined, 'pop', { pitch: 0.9 });
      ACTS.forEach((_, i) => fx(tSurpass + i * stepA, 'rise', { dur: 0.8, pitch: 1 + i * 0.1, gain: 0.6 }));
      fx(tDesigning + 0.1, 'blip', { pitch: 1.4 });
      fx(tSo - 0.3, 'whoosh');
      STEPS.forEach((t0, k) => {
        fx(t0, 'swoosh', { dur: 0.5 });
        fx(t0 + 0.35, 'pop', { pitch: 1 + k * 0.15 });
      });
      fx(tWrote - 0.4, 'whoosh');
      fx(tExplosion, 'rise', { dur: 1.5, pitch: 0.8 });
      fx(tBehind + 0.2, 'blip', { pitch: 0.7 });
      fx(tLast - 0.3, 'whoosh');
      fx(tInvention, 'chime', { pitch: 0.9, dur: 1.4 });
      fx(tCond, 'blip', { pitch: 0.6 });
      fx(tBut - 0.3, 'whoosh');
      fx(tBut, 'pop', { pitch: 0.8 });
      fx(tHard + 0.15, 'chime', { pitch: 0.6, dur: 1.6 });

      // ---- Sixty years back along a timeline --------------------------------
      const X0 = 300; // 1965
      const X1 = 1560; // 2025
      const XT = 1620; // today
      const AY = 640;
      const line = svg('g', {}, stage);
      const axis = svg('rect', { y: AY - 3, height: 6, rx: 3, fill: C.ink500 }, line);
      const ticks = [1965, 1975, 1985, 1995, 2005, 2015, 2025].map((yr) => {
        const x = lerp(X0, X1, (yr - 1965) / 60);
        const g = svg('g', {}, line);
        svg('rect', { x: x - 3, y: AY - 16, width: 6, height: 32, rx: 3, fill: C.slate }, g);
        if (yr < 2025) label(g, String(yr), { x, y: AY + 64, size: 30, weight: 500, fill: C.slate, anchor: 'middle' });
        return g;
      });
      const todayG = svg('g', {}, line);
      svg('circle', { cx: XT, cy: AY, r: 14, fill: C.mint }, todayG);
      label(todayG, 'today', { x: XT, y: AY + 64, size: 32, fill: C.mint, anchor: 'middle' });
      const span = svg('rect', { y: AY - 6, height: 12, rx: 6, fill: C.amber }, line);
      const marker = svg('circle', { cy: AY, r: 17, fill: C.amber }, line);
      const count = label(line, '', { y: AY - 70, size: 60, weight: 700, anchor: 'middle' });
      const year = label(line, '1965', { size: 150, weight: 700, fill: C.amber, anchor: 'middle' });

      // ---- I. J. Good and his paper -----------------------------------------
      const good = svg('g', {}, stage);
      place(person(good).g, { s: 1.5 });
      label(good, 'I. J. Good', { y: 320, size: 56, weight: 700, anchor: 'middle' });
      label(good, 'mathematician', { y: 372, size: 34, weight: 500, fill: C.mist, anchor: 'middle' });
      const paper = paperCard(stage, {
        title: ['Speculations', 'Concerning the First', 'Ultraintelligent', 'Machine'],
        byline: 'I. J. Good',
        year: '1965',
      });
      const who = chip(stage, 'I. J. Good, 1965', { size: 30 });

      // ---- The machine Good imagined, measured against people ---------------
      const BX = 1130;
      const HUMAN = [300, 270, 320, 285, 310];
      const MACH = [520, 570, 500, 545, 590];
      const rowY = (i) => 340 + i * 104;
      const panel = svg('g', {}, stage);
      const pick = svg('rect', {
        x: 700, y: rowY(4) - 52, width: 1060, height: 104, rx: 24,
        fill: C.amber, 'fill-opacity': 0.12, stroke: C.amber, 'stroke-width': 3, opacity: 0,
      }, panel);
      svg('circle', { cx: BX + 11, cy: 236, r: 11, fill: C.sky }, panel);
      label(panel, 'any human', { x: BX + 34, y: 247, size: 30, fill: C.mist });
      svg('circle', { cx: BX + 251, cy: 236, r: 11, fill: C.amber }, panel);
      label(panel, 'the machine', { x: BX + 274, y: 247, size: 30, fill: C.mist });
      const rows = ACTS.map((name, i) => {
        const g = svg('g', {}, panel);
        const y = rowY(i);
        label(g, name, { x: BX - 30, y: y + 12, size: 36, anchor: 'end' });
        const human = svg('rect', { x: BX, y: y - 26, height: 22, rx: 11, fill: C.sky, width: 0 }, g);
        const mach = svg('rect', { x: BX, y: y + 4, height: 22, rx: 11, fill: C.amber, width: 0 }, g);
        return { g, human, mach };
      });
      const imagined = label(stage, 'an imagined machine', { x: 480, y: 790, size: 36, weight: 500, fill: C.mist, anchor: 'middle' });

      // ---- Each machine designs a better one --------------------------------
      const MX = [270, 640, 1080, 1580];
      const MS = [0.5, 0.68, 0.88, 1.12];
      const MY = MS.map((s) => 680 - 160 * s); // bottoms line up
      const LEVELS = [0.25, 0.42, 0.66, 1];
      const rowG = svg('g', {}, stage);
      const links = [0, 1, 2].map((k) => {
        const x0 = MX[k] + 160 * MS[k] + 34;
        const x1 = MX[k + 1] - 160 * MS[k + 1] - 34;
        const a = arrow(rowG, `M ${x0} 610 L ${x1} 610`, { color: C.mist, width: 7, head: 18 });
        const word = label(rowG, 'designs', { x: (x0 + x1) / 2, y: 578, size: 28, fill: C.mist, anchor: 'middle' });
        return { a, word };
      });
      const machines = MX.map(() => machine(rowG, { size: 320 }));
      const meters = MX.map((x, k) => {
        const m = meter(rowG, { w: 220, h: 20, text: k === 0 ? 'thinking ability' : '', size: 28 });
        m.g.setAttribute('transform', `translate(${x - 110} 760)`);
        return m;
      });

      // ---- Good's prediction, drawn as he described it ----------------------
      const OX = 380;
      const OY = 900;
      const CX1 = 1500;
      const HUMAN_H = 170;
      const rise = (u) => 46 * Math.exp(2.517 * u);
      const chart = svg('g', {}, stage);
      const xAxis = arrow(chart, `M ${OX} ${OY} L 1580 ${OY}`, { color: C.slate, width: 5, head: 16 });
      const yAxis = arrow(chart, `M ${OX} ${OY} L ${OX} 320`, { color: C.slate, width: 5, head: 16 });
      label(chart, 'time', { x: 1604, y: OY + 11, size: 30, weight: 500, fill: C.slate });
      label(chart, 'intelligence', { x: OX, y: 292, size: 30, weight: 500, fill: C.slate, anchor: 'middle' });
      const GX = 1420;
      const gapBot = OY - HUMAN_H - 18;
      const gapTop = OY - rise((GX - OX) / (CX1 - OX)) + 26;
      const gap = svg('line', {
        x1: GX, x2: GX, y1: gapBot, y2: gapBot,
        stroke: C.paper, 'stroke-width': 4, 'stroke-dasharray': '4 12', 'stroke-linecap': 'round',
      }, chart);
      const humanLine = arrow(chart, `M ${OX} ${OY - HUMAN_H} L ${CX1} ${OY - HUMAN_H}`, { color: C.sky, width: 8, head: 18 });
      const curve = Array.from({ length: 81 }, (_, i) => `${lerp(OX, CX1, i / 80).toFixed(1)} ${(OY - rise(i / 80)).toFixed(1)}`);
      const machineLine = arrow(chart, `M ${curve.join(' L ')}`, { color: C.amber, width: 9, head: 22 });
      const humansLabel = label(chart, 'humans', { x: CX1 + 34, y: OY - HUMAN_H + 12, size: 34, fill: C.sky });
      const machinesLabel = label(chart, 'machines', { x: CX1 + 34, y: OY - rise(1) + 4, size: 34, fill: C.amber });
      const behind = label(chart, 'left far behind', { x: GX, y: OY - HUMAN_H + 62, size: 34, fill: C.sky, anchor: 'middle' });
      // How far along the machines' curve its tip is when it reaches a given x.
      const fracAtX = (x) => {
        let lo = 0;
        let hi = 1;
        for (let i = 0; i < 24; i++) {
          const mid = (lo + hi) / 2;
          if (machineLine.pointAt(mid).x < x) lo = mid;
          else hi = mid;
        }
        return (lo + hi) / 2;
      };

      const quote = svg('g', {}, stage);
      const q1 = svg('text', { x: 960, y: 196, 'font-size': 40, 'font-weight': 500, 'text-anchor': 'middle', fill: C.paper }, quote);
      svg('tspan', { text: 'The result would be an ' }, q1);
      svg('tspan', { fill: C.amber, 'font-weight': 700, text: '“intelligence explosion”' }, q1);
      const q2 = label(quote, 'and human intelligence would be left far behind.', { x: 960, y: 252, size: 40, weight: 500, anchor: 'middle' });

      // ---- The last invention, and the condition attached to it -------------
      const last = svg('g', {}, stage);
      const lastTitle = label(last, 'The last invention', { x: 960, y: 410, size: 96, weight: 700, fill: C.amber, anchor: 'middle' });
      const lastSub = label(last, 'humans would ever need to make', { x: 960, y: 486, size: 44, weight: 500, anchor: 'middle' });
      const condRule = svg('line', { y1: 590, y2: 590, stroke: C.coral, 'stroke-width': 4, 'stroke-linecap': 'round' }, last);
      const condTag = label(last, 'on one condition', { x: 960, y: 650, size: 34, fill: C.coral, anchor: 'middle' });
      const cond1 = label(last, 'The machine must be obedient enough', { x: 960, y: 738, size: 48, weight: 500, anchor: 'middle' });
      const cond2 = label(last, 'to tell us how to keep it under control.', { x: 960, y: 802, size: 48, weight: 500, anchor: 'middle' });

      // ---- What Good left open ----------------------------------------------
      const IX = 960;
      const IY = 460;
      const idea = machine(stage, { size: 380, outline: true });
      const qmark = label(stage, '?', { size: 220, weight: 700, fill: C.mist, anchor: 'middle' });
      const rings = [0, 1].map(() =>
        svg('rect', { x: -70, y: -70, width: 140, height: 140, rx: 30, fill: 'none', stroke: C.coral, 'stroke-width': 5 }, stage));
      const core = svg('rect', { x: -70, y: -70, width: 140, height: 140, rx: 30, fill: C.coral }, stage);
      const how = label(stage, 'Good did not say how to build it.', { x: IX, y: 770, size: 44, weight: 500, fill: C.mist, anchor: 'middle' });
      const hard = label(stage, 'A hard problem inside the idea', { x: IX, y: 770, size: 54, weight: 700, fill: C.coral, anchor: 'middle' });

      const DURATION = T.duration;
      const show = (el, o) => el.setAttribute('opacity', o.toFixed(3));

      function render(t) {
        bg(T.offset + t);

        // -- the timeline, read backwards from today to 1965
        place(line, { y: -40 * prog(t, tGood - 0.25, 0.4, ease.in), o: prog(t, 0.1, 0.3) * (1 - prog(t, tGood - 0.25, 0.4)) });
        const aw = (XT - X0 + 100) * prog(t, 0.1, 0.9);
        axis.setAttribute('x', (XT + 50 - aw).toFixed(2));
        axis.setAttribute('width', aw.toFixed(2));
        ticks.forEach((g, i) => show(g, prog(t, 0.25 + (6 - i) * 0.08, 0.3)));
        const back = prog(t, tOld + 0.2, tYear - tOld - 0.4, ease.inOut);
        const mx = lerp(XT, X0, back);
        marker.setAttribute('cx', mx.toFixed(2));
        show(marker, prog(t, tOld, 0.2));
        span.setAttribute('x', mx.toFixed(2));
        span.setAttribute('width', (XT - mx).toFixed(2));
        count.setAttribute('x', ((mx + XT) / 2).toFixed(2));
        count.textContent = back >= 1 ? 'more than 60 years' : `${Math.floor(back * 60)} years`;
        show(count, prog(t, tOld + 0.3, 0.3));
        const yearIn = prog(t, tYear, 0.5, ease.outBack);
        place(year, { x: 340, y: 490 + lerp(30, 0, yearIn), s: lerp(0.6, 1, yearIn), o: prog(t, tYear, 0.25) });

        // -- Good, and the paper the idea comes from
        const goodOff = 1 - prog(t, tImagined - 0.35, 0.4);
        place(good, { x: 560, y: 440 + lerp(50, 0, prog(t, tGood - 0.05, 0.6, ease.outBack)), o: prog(t, tGood - 0.05, 0.3) * goodOff });
        const paperIn = prog(t, tGood + 0.4, 0.6, ease.outBack);
        place(paper.g, { x: 1230, y: 540 + lerp(60, 0, paperIn), s: 0.9, r: lerp(5, 0, paperIn), o: prog(t, tGood + 0.4, 0.3) * goodOff });
        place(who.g, { x: 240, y: 84 + lerp(-20, 0, prog(t, tImagined - 0.1, 0.5)), o: prog(t, tImagined - 0.1, 0.4) });

        // -- the imagined machine passes any human at every activity
        show(panel, prog(t, tImagined + 0.7, 0.4) * (1 - prog(t, tSo - 0.35, 0.4)));
        rows.forEach((r, i) => {
          const dim = i === 4 ? 1 : 1 - 0.65 * prog(t, tDesigning + 0.1, 0.4);
          show(r.g, prog(t, tImagined + 0.8 + i * 0.1, 0.3) * dim);
          r.human.setAttribute('width', (HUMAN[i] * prog(t, tImagined + 0.9 + i * 0.1, 0.5)).toFixed(2));
          r.mach.setAttribute('width', (MACH[i] * prog(t, tSurpass + i * stepA, 0.9, ease.inOut)).toFixed(2));
        });
        show(pick, prog(t, tDesigning + 0.1, 0.35));
        show(imagined, prog(t, tImagined + 0.5, 0.4) * (1 - prog(t, tSo - 0.35, 0.4)));

        // -- designing machines is one of them, so each machine designs the next
        const toRow = prog(t, tSo - 0.2, 0.8, ease.inOut);
        const first = prog(t, tImagined, 0.6, ease.outBack);
        place(machines[0].g, {
          x: lerp(480, MX[0], toRow), y: lerp(540, MY[0], toRow) + lerp(40, 0, first),
          s: lerp(1, MS[0], toRow) * first, o: prog(t, tImagined, 0.25),
        });
        STEPS.forEach((t0, k) => {
          links[k].a.draw(prog(t, t0, 0.45, ease.inOut));
          show(links[k].word, prog(t, t0, 0.3));
          const p = prog(t, t0 + 0.35, 0.55, ease.outBack);
          place(machines[k + 1].g, { x: MX[k + 1], y: MY[k + 1] + lerp(24, 0, p), s: MS[k + 1] * p, o: prog(t, t0 + 0.35, 0.2) });
        });
        meters.forEach((m, k) => {
          const t0 = k === 0 ? tSo + 0.5 : STEPS[k - 1] + 0.6;
          show(m.g, prog(t, t0, 0.3));
          m.set(LEVELS[k] * prog(t, t0 + 0.1, 0.6));
        });
        show(rowG, 1 - prog(t, tWrote - 0.45, 0.4));

        // -- the intelligence explosion, in Good's words
        const leave = 1 - prog(t, tLast - 0.35, 0.4);
        show(chart, prog(t, tWrote - 0.1, 0.4) * leave);
        show(quote, leave);
        show(q1, prog(t, tWrote + 0.2, 0.5));
        show(q2, prog(t, tBehind - 0.3, 0.5));
        xAxis.draw(prog(t, tWrote - 0.1, 0.6, ease.inOut));
        yAxis.draw(prog(t, tWrote - 0.1, 0.6, ease.inOut));
        const across = kf(t, [[tWrote + 0.8, 0], [tExplosion, 0.5, ease.linear], [tExplosion + 1.5, 1, ease.inOut]]);
        humanLine.draw(across);
        machineLine.draw(across > 0 ? fracAtX(lerp(OX, CX1, across)) : 0);
        show(humansLabel, prog(t, tExplosion + 1.4, 0.4));
        show(machinesLabel, prog(t, tExplosion + 1.4, 0.4));
        gap.setAttribute('y2', lerp(gapBot, gapTop, prog(t, tBehind + 0.2, 0.8, ease.inOut)).toFixed(1));
        show(gap, prog(t, tBehind + 0.2, 0.2));
        show(behind, prog(t, tBehind + 0.6, 0.4));

        // -- what Good did not say, and the problem inside the idea
        // -- the last invention, and its condition
        show(last, 1 - prog(t, tBut - 0.35, 0.4));
        place(lastTitle, { x: 0, y: lerp(30, 0, prog(t, tInvention - 0.1, 0.6)), o: prog(t, tInvention - 0.1, 0.5) });
        show(lastSub, prog(t, tNeed, 0.5));
        const ruleHalf = 220 * prog(t, tCond, 0.6, ease.inOut);
        condRule.setAttribute('x1', (960 - ruleHalf).toFixed(1));
        condRule.setAttribute('x2', (960 + ruleHalf).toFixed(1));
        show(condRule, prog(t, tCond, 0.2));
        show(condTag, prog(t, tCond + 0.3, 0.4));
        show(cond1, prog(t, tObey, 0.5));
        show(cond2, prog(t, tTell, 0.5));

        const ideaIn = prog(t, tBut, 0.6, ease.outBack);
        place(idea.g, { x: IX, y: IY + lerp(40, 0, ideaIn), s: ideaIn, o: prog(t, tBut, 0.25) });
        const asking = 1 - prog(t, tHard - 0.1, 0.3);
        place(qmark, { x: IX, y: IY + 76, s: lerp(0.6, 1, prog(t, tBut + 0.5, 0.5, ease.outBack)), o: prog(t, tBut + 0.5, 0.3) * asking });
        show(how, prog(t, tBut + 0.9, 0.4) * asking);
        const throb = 1 + 0.05 * Math.sin((t - tHard) * 4.5);
        place(core, { x: IX, y: IY, s: prog(t, tHard + 0.15, 0.5, ease.outBack) * throb, o: prog(t, tHard + 0.15, 0.2) });
        rings.forEach((ring, i) => {
          const phase = ((((t - tHard - 0.5) / 1.6 + i * 0.5) % 1) + 1) % 1;
          place(ring, { x: IX, y: IY, s: 1 + phase * 0.9, o: t > tHard + 0.5 ? (1 - phase) * 0.6 : 0 });
        });
        show(hard, prog(t, tHard + 0.3, 0.4));
      }

      mount({ duration: DURATION, render, sfx });
    </script>
  </body>
</html>
