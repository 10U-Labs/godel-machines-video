---
env:
  BLENDER: ${{ inputs.blender }}
  PRODUCTION: ${{ inputs.production }}
jobs:
  clip:
    needs: frames
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Download frames
        uses: actions/download-artifact@v8
        with:
          merge-multiple: "true"
          path: out/${{ env.PRODUCTION }}/frames
          pattern: frames-${{ inputs.scene }}-*
      - name: Download narration
        uses: actions/download-artifact@v8
        with:
          name: narration
          path: out/${{ env.PRODUCTION }}/voice
      - name: Encode the clip and pick stills
        run: python3 src/blender/clips.py encode "$PRODUCTION" "${{ inputs.scene }}"
      - name: Upload the clip
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ inputs.clip }}
          path: out/${{ env.PRODUCTION }}/scenes
      - name: Upload stills
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: stills-${{ inputs.scene }}
          path: out/${{ env.PRODUCTION }}/stills
  frames:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: "true"
      - name: Install libraries Blender needs
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libice6 libsm6 libxfixes3 libxi6 libxkbcommon0 libxrender1 libxxf86vm1
      - name: Restore Blender
        uses: actions/cache@v6
        with:
          key: ${{ env.BLENDER }}
          path: tools/${{ env.BLENDER }}
      - name: Download Blender
        run: |
          mkdir -p tools
          test -d "tools/$BLENDER" && exit 0
          curl -fsSL "https://download.blender.org/release/Blender4.5/$BLENDER.tar.xz" | tar -xJ -C tools
      - name: Download narration
        uses: actions/download-artifact@v8
        with:
          name: narration
          path: out/${{ env.PRODUCTION }}/voice
      - name: Render frames
        run: |
          scene="${{ inputs.scene }}"
          start="${{ matrix.chunk.start }}"
          sfx=""
          if [ "$start" = "1" ]; then sfx="--sfx"; fi
          # shellcheck disable=SC2086
          "tools/$BLENDER/blender" -b --factory-startup --python-exit-code 1 -P src/blender/render_scene.py -- \
            --production "$PRODUCTION" --scene "$scene" --start "$start" --end "${{ matrix.chunk.end }}" $sfx
      - name: Upload frames
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: frames-${{ inputs.scene }}-${{ matrix.chunk.start }}
          path: out/${{ env.PRODUCTION }}/frames
          retention-days: 3
    strategy:
      fail-fast: true
      matrix:
        chunk: ${{ fromJSON(inputs.chunks) }}
name: scene
on:
  workflow_call:
    inputs:
      blender:
        description: The Blender release to render with
        required: true
        type: string
      chunks:
        description: The scene's frames split into chunks, as a JSON list of {"start", "end"}
        required: true
        type: string
      clip:
        description: The artifact name to keep the scene's clip under
        required: true
        type: string
      production:
        description: The name of the production the scene belongs to
        required: true
        type: string
      scene:
        description: The id of the scene to render
        required: true
        type: string
