---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  PRODUCTION: godel-machines
jobs:
  samples:
    needs: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-voices.txt
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - if: matrix.engine == 'pocket'
        name: Install Pocket TTS
        run: pip install -r requirements-voices.txt
      - if: matrix.engine == 'kokoro'
        name: Restore voice model
        uses: actions/cache@v6
        with:
          key: kokoro-v1.0-fp16
          path: models/kokoro
      - if: matrix.engine == 'kokoro'
        name: Download voice model
        run: |
          mkdir -p models/kokoro
          cd models/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download
          for file in kokoro-v1.0.fp16.onnx voices-v1.0.bin; do
            test -f "$file" && continue
            curl -fsSL -o "$file" "$base/model-files-v1.0/$file"
          done
      - name: Read the opening in each voice
        run: python src/voice/sample_voices.py ${{ matrix.engine }} "$PRODUCTION"
      - name: Upload samples
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: voice-samples-${{ matrix.engine }}
          path: out/${{ env.PRODUCTION }}/voice-samples
    strategy:
      fail-fast: false
      matrix:
        engine:
          - kokoro
          - pocket
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: >-
            {extends: default, rules: {
            empty-lines: {max: 0, max-start: 0, max-end: 1},
            key-ordering: enable,
            line-length: disable,
            new-line-at-end-of-file: enable,
            truthy: {allowed-values: ["true", "false", "on"]}}}
          file_or_dir: .github/workflows/voices.yml
          strict: "true"
name: voices
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/voices.yml"
      - "requirements-voices.txt"
      - "src/voice/sample_voices.py"
  workflow_dispatch: {}
