---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  BLENDER: blender-4.5.16-linux-x64
jobs:
  film:
    needs:
      - narration
      - scenes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Download narration
        uses: actions/download-artifact@v8
        with:
          name: narration
          path: out/voice
      - name: Download scenes
        uses: actions/download-artifact@v8
        with:
          name: scenes
          path: out/scenes
      - name: Mix the soundtrack
        run: python src/audio/mix.py
      - name: Assemble the film
        run: python src/render/assemble.py
      - name: Upload film
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: film
          path: out/film.mp4
  frames:
    needs: narration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: "true"
      - name: Install libraries Blender needs
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1 libice6 libsm6 libxfixes3 libxi6 libxkbcommon0 libxrender1 libxxf86vm1
      - name: Restore Blender
        uses: actions/cache@v6
        with:
          key: ${{ env.BLENDER }}
          path: tools/${{ env.BLENDER }}
      - name: Download Blender
        run: |
          mkdir -p tools
          test -d "tools/$BLENDER" && exit 0
          curl -fsSL "https://download.blender.org/release/Blender4.5/$BLENDER.tar.xz" | tar -xJ -C tools
      - name: Download narration
        uses: actions/download-artifact@v8
        with:
          name: narration
          path: out/voice
      - name: Render frames
        run: |
          scene="${{ matrix.chunk.scene }}"
          start="${{ matrix.chunk.start }}"
          sfx=""
          if [ "$start" = "1" ]; then sfx="--sfx out/frames/$scene/sfx.json"; fi
          # shellcheck disable=SC2086
          "tools/$BLENDER/blender" -b --factory-startup --python-exit-code 1 -P src/blender/render_scene.py -- \
            --scene "$scene" --timings out/voice/timings.json --out "out/frames/$scene" \
            --start "$start" --end "${{ matrix.chunk.end }}" $sfx
      - name: Upload frames
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: frames-${{ matrix.chunk.scene }}-${{ matrix.chunk.start }}
          path: out/frames
          retention-days: 3
    strategy:
      fail-fast: true
      matrix:
        chunk: ${{ fromJSON(needs.narration.outputs.chunks) }}
  narration:
    needs: yamllint
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Restore voice model
        uses: actions/cache@v6
        with:
          key: kokoro-v1.0-fp16
          path: models/kokoro
      - name: Download voice model
        run: |
          mkdir -p models/kokoro
          cd models/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download
          for file in kokoro-v1.0.fp16.onnx voices-v1.0.bin; do
            test -f "$file" && continue
            curl -fsSL -o "$file" "$base/model-files-v1.0/$file"
          done
      - name: Restore narration clips
        uses: actions/cache@v6
        with:
          key: narration-${{ hashFiles('script/script.md', 'src/voice/**') }}
          path: out/voice/lines
          restore-keys: narration-
      - name: Generate narration
        run: python src/voice/make_voice.py script/script.md
      - id: plan
        name: Plan render chunks
        run: echo "chunks=$(python src/blender/plan.py out/voice/timings.json --chunk 60)" >> "$GITHUB_OUTPUT"
      - name: Upload narration
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: narration
          path: |
            out/voice/*.wav
            out/voice/timings.json
  scenes:
    needs: frames
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Download frames
        uses: actions/download-artifact@v8
        with:
          merge-multiple: "true"
          path: out/frames
          pattern: frames-*
      - name: Encode scenes and pick stills
        run: |
          cd out
          mkdir -p scenes stills
          for dir in frames/*/; do
            id=$(basename "$dir")
            ffmpeg -v error -framerate 30 -i "frames/$id/frame_%04d.png" -c:v libx264 -pix_fmt yuv420p -crf 18 "scenes/$id.mp4"
            cp "frames/$id/sfx.json" "scenes/$id.sfx.json"
            for png in frames/"$id"/frame_*.png; do
              n=$(basename "$png" .png | sed 's/^frame_0*//')
              if [ $(( (n - 1) % 60 )) -eq 0 ]; then cp "$png" "stills/$id-$(basename "$png")"; fi
            done
          done
      - name: Upload scenes
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: scenes
          path: out/scenes
      - name: Upload stills
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: stills
          path: out/stills
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: >-
            {extends: default, rules: {
            empty-lines: {max: 0, max-start: 0, max-end: 1},
            key-ordering: enable,
            line-length: disable,
            new-line-at-end-of-file: enable,
            truthy: {allowed-values: ["true", "false", "on"]}}}
          file_or_dir: .github/workflows/render.yml
          strict: "true"
name: render
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render.yml"
      - "requirements.txt"
      - "script/**"
      - "src/**"
  workflow_dispatch: {}
