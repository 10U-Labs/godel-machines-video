---
concurrency:
  cancel-in-progress: true
  group: render-${{ inputs.production }}-${{ github.ref }}
env:
  DO_NOT_TRACK: "1"
  HYPERFRAMES_NO_TELEMETRY: "1"
  HYPERFRAMES_NO_UPDATE_CHECK: "1"
  PRODUCTION: ${{ inputs.production }}
jobs:
  adopt:
    if: needs.narration.outputs.adopt != '[]'
    needs: narration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Download the clip and its narration
        run: |
          python3 src/hyperframes/clips.py adopt "$PRODUCTION" "${{ matrix.clip.scene }}" --source "${{ matrix.clip.source }}" \
            --artifact "${{ matrix.clip.artifact }}" --narration "${{ matrix.clip.narration }}"
      - name: Upload the clip under its name
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ matrix.clip.clip }}
          path: |
            out/${{ env.PRODUCTION }}/scenes/${{ matrix.clip.scene }}.mp4
            out/${{ env.PRODUCTION }}/scenes/${{ matrix.clip.scene }}.sfx.json
            out/${{ env.PRODUCTION }}/scenes/${{ matrix.clip.scene }}.timings.json
            out/${{ env.PRODUCTION }}/scenes/${{ matrix.clip.scene }}.wav
    strategy:
      matrix:
        clip: ${{ fromJSON(needs.narration.outputs.adopt) }}
  film:
    if: ${{ !cancelled() && !failure() && needs.narration.result == 'success' }}
    needs:
      - adopt
      - narration
      - scenes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: |
          for attempt in 1 2 3; do
            sudo timeout --kill-after=15 120 apt-get --option Acquire::http::Timeout=20 update \
              && sudo timeout --kill-after=15 180 apt-get --option Acquire::http::Timeout=20 install --yes ffmpeg \
              && exit 0
            echo "::warning::Attempt $attempt to install ffmpeg failed or ran past its time limit, as it does when the runner's package mirror is slow"
            sudo dpkg --configure --pending || true
          done
          exit 1
      - name: Download narration
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PRODUCTION }}-narration
          path: out/${{ env.PRODUCTION }}/voice
      - name: Download the clip names
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PRODUCTION }}-clips
          path: out/${{ env.PRODUCTION }}
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Download every scene's clip
        run: python src/hyperframes/clips.py fetch "$PRODUCTION"
      - name: Mix the soundtrack
        run: python src/audio/mix.py "$PRODUCTION"
      - name: Assemble the film
        run: python src/render/assemble.py "$PRODUCTION"
      - name: Write the captions
        run: python src/render/captions.py "$PRODUCTION"
      - name: Upload film
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ env.PRODUCTION }}-film
          path: |
            out/${{ env.PRODUCTION }}/${{ env.PRODUCTION }}.mp4
            out/${{ env.PRODUCTION }}/${{ env.PRODUCTION }}.srt
  narration:
    outputs:
      adopt: ${{ steps.plan.outputs.adopt }}
      render: ${{ steps.plan.outputs.render }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Restore voice model
        uses: actions/cache@v6
        with:
          key: kokoro-v1.0-fp16
          path: models/kokoro
      - name: Download voice model
        run: |
          mkdir -p models/kokoro
          cd models/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download
          for file in kokoro-v1.0.fp16.onnx voices-v1.0.bin; do
            test -f "$file" && continue
            curl -fsSL -o "$file" "$base/model-files-v1.0/$file"
          done
      - name: Restore narration clips
        uses: actions/cache@v6
        with:
          key: narration-${{ env.PRODUCTION }}-${{ hashFiles(format('productions/{0}/production.toml', env.PRODUCTION), format('productions/{0}/script.md', env.PRODUCTION), format('productions/{0}/pronunciations.json', env.PRODUCTION), 'src/voice/**') }}
          path: out/${{ env.PRODUCTION }}/voice/lines
          restore-keys: narration-${{ env.PRODUCTION }}-
      - name: Generate narration
        run: python src/voice/make_voice.py "$PRODUCTION"
      - env:
          ADOPT: ${{ inputs.adopt }}
          GH_TOKEN: ${{ github.token }}
        id: plan
        name: Plan which scenes to render
        run: python src/hyperframes/plan.py "$PRODUCTION" --adopt "$ADOPT" >> "$GITHUB_OUTPUT"
      - name: Upload narration
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ env.PRODUCTION }}-narration
          path: |
            out/${{ env.PRODUCTION }}/voice/*.wav
            out/${{ env.PRODUCTION }}/voice/timings.json
      - name: Upload the clip names
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ env.PRODUCTION }}-clips
          path: out/${{ env.PRODUCTION }}/clips.json
  release:
    if: ${{ inputs.release && !cancelled() && needs.film.result == 'success' }}
    needs: film
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download the film
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PRODUCTION }}-film
          path: out/${{ env.PRODUCTION }}
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Publish the film and its captions
        run: python3 src/render/release.py "$PRODUCTION" --target "$GITHUB_SHA"
  scenes:
    env:
      SCENE: ${{ matrix.clip.scene }}
    if: needs.narration.outputs.render != '[]'
    needs: narration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: "true"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: "22"
      - name: Install ffmpeg
        run: |
          for attempt in 1 2 3; do
            sudo timeout --kill-after=15 120 apt-get --option Acquire::http::Timeout=20 update \
              && sudo timeout --kill-after=15 180 apt-get --option Acquire::http::Timeout=20 install --yes ffmpeg \
              && exit 0
            echo "::warning::Attempt $attempt to install ffmpeg failed or ran past its time limit, as it does when the runner's package mirror is slow"
            sudo dpkg --configure --pending || true
          done
          exit 1
      - name: Install Hyperframes
        run: npm ci --ignore-scripts
      - name: Download narration
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PRODUCTION }}-narration
          path: out/${{ env.PRODUCTION }}/voice
      - name: Build the scene's page
        run: python3 src/hyperframes/page.py "$PRODUCTION" "$SCENE"
      - name: Fetch the browser
        run: npx hyperframes browser ensure
      - name: Render the page
        run: |
          npx hyperframes render "out/$PRODUCTION/pages/$SCENE" --output "out/$PRODUCTION/pages/$SCENE.mp4" $(python3 src/hyperframes/clips.py render)
      - name: Keep the clip and pick stills
        run: python3 src/hyperframes/clips.py keep "$PRODUCTION" "$SCENE"
      - name: Upload the clip
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ matrix.clip.clip }}
          path: out/${{ env.PRODUCTION }}/scenes
      - name: Upload stills
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ env.PRODUCTION }}-stills-${{ matrix.clip.scene }}
          path: out/${{ env.PRODUCTION }}/stills
    strategy:
      fail-fast: false
      matrix:
        clip: ${{ fromJSON(needs.narration.outputs.render) }}
name: render
on:
  workflow_call:
    inputs:
      adopt:
        description: The id of an earlier run whose scene clips to take, in place of rendering, for the scenes that have none
        required: false
        type: string
      production:
        description: The name of the production to render, a folder in productions/
        required: true
        type: string
      release:
        default: false
        description: Publish the film and its captions as a GitHub release, which anyone can see
        required: false
        type: boolean
permissions:
  actions: read
  contents: read
