---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  BLENDER: blender-4.5.16-linux-x64
jobs:
  adopt:
    if: needs.narration.outputs.adopt != '[]'
    needs: narration
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        name: Download the clip
        run: |
          scene="${{ matrix.clip.scene }}"
          gh run download "${{ matrix.clip.run }}" --name "${{ matrix.clip.artifact }}" --dir out/adopt
          test -f "out/adopt/$scene.mp4"
          test -f "out/adopt/$scene.sfx.json"
      - name: Upload the clip under its name
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ matrix.clip.clip }}
          path: |
            out/adopt/${{ matrix.clip.scene }}.mp4
            out/adopt/${{ matrix.clip.scene }}.sfx.json
    strategy:
      matrix:
        clip: ${{ fromJSON(needs.narration.outputs.adopt) }}
  film:
    if: ${{ !cancelled() && !failure() && needs.narration.result == 'success' }}
    needs:
      - adopt
      - narration
      - scenes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Download narration
        uses: actions/download-artifact@v8
        with:
          name: narration
          path: out/voice
      - name: Download the clip names
        uses: actions/download-artifact@v8
        with:
          name: clips
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Download every scene's clip
        run: python src/blender/clips.py fetch out/clips.json
      - name: Mix the soundtrack
        run: python src/audio/mix.py
      - name: Assemble the film
        run: python src/render/assemble.py
      - name: Write the captions
        run: python src/render/captions.py
      - name: Upload film
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: film
          path: |
            out/film.mp4
            out/film.srt
  narration:
    needs: yamllint
    outputs:
      adopt: ${{ steps.plan.outputs.adopt }}
      blender: ${{ env.BLENDER }}
      render: ${{ steps.plan.outputs.render }}
      scenes: ${{ steps.plan.outputs.scenes }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Restore voice model
        uses: actions/cache@v6
        with:
          key: kokoro-v1.0-fp16
          path: models/kokoro
      - name: Download voice model
        run: |
          mkdir -p models/kokoro
          cd models/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download
          for file in kokoro-v1.0.fp16.onnx voices-v1.0.bin; do
            test -f "$file" && continue
            curl -fsSL -o "$file" "$base/model-files-v1.0/$file"
          done
      - name: Restore narration clips
        uses: actions/cache@v6
        with:
          key: narration-${{ hashFiles('script/script.md', 'src/voice/**') }}
          path: out/voice/lines
          restore-keys: narration-
      - name: Generate narration
        run: python src/voice/make_voice.py script/script.md
      - env:
          ADOPT: ${{ inputs.adopt }}
          GH_TOKEN: ${{ github.token }}
        id: plan
        name: Plan which scenes to render
        run: python src/blender/plan.py out/voice/timings.json --blender "$BLENDER" --chunk 90 --clips out/clips.json --adopt "$ADOPT" >> "$GITHUB_OUTPUT"
      - name: Upload narration
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: narration
          path: |
            out/voice/*.wav
            out/voice/timings.json
      - name: Upload the clip names
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: clips
          path: out/clips.json
  scenes:
    if: needs.narration.outputs.scenes != '[]'
    needs: narration
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(needs.narration.outputs.scenes) }}
    uses: ./.github/workflows/scene.yml
    with:
      blender: ${{ needs.narration.outputs.blender }}
      chunks: ${{ toJSON(fromJSON(needs.narration.outputs.render)[matrix.scene].chunks) }}
      clip: ${{ fromJSON(needs.narration.outputs.render)[matrix.scene].clip }}
      scene: ${{ matrix.scene }}
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: >-
            {extends: default, rules: {
            empty-lines: {max: 0, max-start: 0, max-end: 1},
            key-ordering: enable,
            line-length: disable,
            new-line-at-end-of-file: enable,
            truthy: {allowed-values: ["true", "false", "on"]}}}
          file_or_dir: .github/workflows/render.yml .github/workflows/scene.yml
          strict: "true"
name: render
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render.yml"
      - ".github/workflows/scene.yml"
      - "requirements.txt"
      - "script/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      adopt:
        description: The id of an earlier run whose scene clips to take, in place of rendering, for the scenes that have none
        required: false
        type: string
permissions:
  actions: read
  contents: read
