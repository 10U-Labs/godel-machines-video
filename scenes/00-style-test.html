<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Style test</title>
    <link rel="stylesheet" href="lib/style.css" />
  </head>
  <body>
    <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
    <script type="module">
      // Look-development scene, not part of the film: a program rewrites one of
      // its own lines and its measured performance rises.
      import { mount, svg, place, prog, kf, ease, rand, lerp } from './lib/anim.js';
      import { C } from './lib/palette.js';

      const stage = document.getElementById('stage');
      const DURATION = 8;

      // ---- Backdrop -------------------------------------------------------
      const defs = svg('defs', {}, stage);
      const bg = svg('radialGradient', { id: 'bg', cx: '38%', cy: '42%', r: '85%' }, defs);
      svg('stop', { offset: '0%', 'stop-color': C.ink700 }, bg);
      svg('stop', { offset: '55%', 'stop-color': C.ink800 }, bg);
      svg('stop', { offset: '100%', 'stop-color': C.ink900 }, bg);
      svg('rect', { width: 1920, height: 1080, fill: 'url(#bg)' }, stage);

      const blobs = [
        { x: 1500, y: 180, r: 420, fill: C.ink600, o: 0.35, dx: 30, dy: 18 },
        { x: 240, y: 960, r: 360, fill: C.ink600, o: 0.3, dx: -22, dy: -14 },
        { x: 1720, y: 940, r: 240, fill: C.violetDeep, o: 0.16, dx: -16, dy: 20 },
      ].map((b) => ({ ...b, el: svg('circle', { r: b.r, fill: b.fill }, stage) }));

      const dots = Array.from({ length: 46 }, (_, i) => ({
        x: rand(i * 3 + 1) * 1920,
        y: rand(i * 3 + 2) * 1080,
        r: 1.5 + rand(i * 3 + 3) * 2.5,
        phase: rand(i * 7 + 5) * Math.PI * 2,
        el: svg('circle', { fill: C.mist }, stage),
      }));

      // ---- The program window --------------------------------------------
      const WIN = { x: 600, y: 520, w: 760, h: 540 };
      const win = svg('g', {}, stage);
      const L = -WIN.w / 2;
      const T = -WIN.h / 2;
      svg('rect', { x: L + 14, y: T + 20, width: WIN.w, height: WIN.h, rx: 34, fill: C.ink900, opacity: 0.45 }, win);
      svg('rect', { x: L, y: T, width: WIN.w, height: WIN.h, rx: 34, fill: C.ink600 }, win);
      svg('rect', { x: L, y: T + 78, width: WIN.w, height: WIN.h - 78, rx: 34, fill: C.ink700 }, win);
      svg('rect', { x: L, y: T + 78, width: WIN.w, height: 40, fill: C.ink700 }, win);
      [C.coral, C.amber, C.mint].forEach((fill, i) => {
        svg('circle', { cx: L + 48 + i * 40, cy: T + 40, r: 12, fill }, win);
      });
      svg('text', { x: L + WIN.w - 40, y: T + 51, 'text-anchor': 'end', 'font-size': 28, 'font-weight': 600, fill: C.mist, text: 'program.py' }, win);

      const LINE_COLORS = [C.sky, C.mist, C.violet, C.mist, C.mist, C.sky, C.mist, C.violet, C.mist];
      const INDENTS = [0, 1, 1, 2, 2, 1, 2, 2, 0];
      const TARGET = 4;
      const lines = LINE_COLORS.map((fill, i) => {
        const x = L + 56 + INDENTS[i] * 52;
        const y = T + 128 + i * 44;
        const w = 180 + rand(i + 40) * 330;
        const el = svg('rect', { x, y, height: 20, rx: 10, fill }, win);
        return { x, y, w, el };
      });
      const target = lines[TARGET];
      const NEW_W = 500;
      const newLine = svg('rect', { x: target.x, y: target.y, height: 20, rx: 10, fill: C.amber }, win);
      const focus = svg('rect', { x: L + 28, y: target.y - 13, width: WIN.w - 56, height: 46, rx: 16, fill: C.amber, 'fill-opacity': 0.14, stroke: C.amber, 'stroke-width': 3 }, win);
      const cursor = svg('rect', { y: target.y - 6, width: 6, height: 32, rx: 3, fill: C.paper }, win);

      // ---- Performance meter ---------------------------------------------
      const meter = svg('g', {}, stage);
      const M = { x: WIN.x - WIN.w / 2, y: 860, w: WIN.w, h: 30 };
      svg('text', { x: M.x, y: M.y - 20, 'font-size': 30, 'font-weight': 600, fill: C.mist, text: 'Measured performance' }, meter);
      svg('rect', { x: M.x, y: M.y, width: M.w, height: M.h, rx: 15, fill: C.ink600 }, meter);
      const meterFill = svg('rect', { x: M.x, y: M.y, height: M.h, rx: 15, fill: C.mint }, meter);

      // ---- Title ----------------------------------------------------------
      const TX = 1090;
      const title1 = svg('text', { 'font-size': 88, 'font-weight': 700, fill: C.paper, text: 'Recursive' }, stage);
      const title2 = svg('text', { 'font-size': 88, 'font-weight': 700, fill: C.amber, text: 'self-improvement' }, stage);
      const sub1 = svg('text', { 'font-size': 40, 'font-weight': 500, fill: C.mist, text: 'A program that rewrites its own code,' }, stage);
      const sub2 = svg('text', { 'font-size': 40, 'font-weight': 500, fill: C.mist, text: 'then uses the new code to do it again.' }, stage);

      function render(t) {
        for (const b of blobs) {
          const drift = Math.sin((t / DURATION) * Math.PI * 2);
          place(b.el, { x: b.x + b.dx * drift, y: b.y + b.dy * drift, o: b.o });
        }
        for (const d of dots) {
          const tw = 0.25 + 0.2 * Math.sin(t * 1.3 + d.phase);
          d.el.setAttribute('cx', d.x);
          d.el.setAttribute('cy', d.y - t * 2);
          d.el.setAttribute('r', d.r);
          d.el.setAttribute('opacity', tw.toFixed(3));
        }

        // Window pops in, then gives a small pulse when the rewrite lands.
        const pop = prog(t, 0.3, 0.7, ease.outBack);
        const pulse = 1 + 0.03 * Math.sin(prog(t, 4.3, 0.5, ease.linear) * Math.PI);
        place(win, { x: WIN.x, y: WIN.y + lerp(40, 0, pop), s: pop * pulse, o: prog(t, 0.3, 0.3) });

        lines.forEach((ln, i) => {
          let w = ln.w * prog(t, 0.8 + i * 0.07, 0.45);
          if (i === TARGET) w *= 1 - prog(t, 2.9, 0.5, ease.inOut);
          ln.el.setAttribute('width', Math.max(0, w).toFixed(2));
        });

        const grow = prog(t, 3.5, 0.8, ease.inOut);
        newLine.setAttribute('width', (NEW_W * grow).toFixed(2));
        newLine.setAttribute('opacity', grow > 0 ? 1 : 0);

        const focusO = kf(t, [[2.2, 0], [2.6, 1], [4.6, 1], [5.2, 0]]);
        focus.setAttribute('opacity', focusO.toFixed(3));

        const oldW = target.w * (1 - prog(t, 2.9, 0.5, ease.inOut));
        const cursorX = t < 3.5 ? target.x + oldW + 8 : target.x + NEW_W * grow + 8;
        cursor.setAttribute('x', cursorX.toFixed(2));
        const blink = Math.sin(t * 9) > -0.2 ? 1 : 0.15;
        cursor.setAttribute('opacity', (focusO * blink).toFixed(3));

        place(meter, { y: lerp(30, 0, prog(t, 1.4, 0.6)), o: prog(t, 1.4, 0.6) });
        const level = kf(t, [[1.6, 0], [2.3, 0.42, ease.out], [4.3, 0.42], [5.2, 0.68, ease.outBack]]);
        meterFill.setAttribute('width', (M.w * level).toFixed(2));

        const rows = [
          [title1, 470, 1.0],
          [title2, 575, 1.15],
          [sub1, 680, 1.6],
          [sub2, 736, 1.75],
        ];
        for (const [el, y, start] of rows) {
          const p = prog(t, start, 0.7, ease.outQuint);
          place(el, { x: TX, y: y + lerp(36, 0, p), o: prog(t, start, 0.5) });
        }
      }

      mount({ duration: DURATION, render });
    </script>
  </body>
</html>
