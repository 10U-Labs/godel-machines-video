<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{width}}, height={{height}}" />
    <title>{{title}}</title>
    <style>
      @font-face {
        font-family: "Figtree";
        font-weight: 300 900;
        src: url("assets/fonts/Figtree.ttf");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 100 800;
        src: url("assets/fonts/JetBrainsMono.ttf");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: {{width}}px;
        height: {{height}}px;
        overflow: hidden;
        background: #0b1030;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- The scene is drawn by script for each time it is asked for, so it has no timeline of its own. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{duration}}"
      data-width="{{width}}"
      data-height="{{height}}"
      data-no-timeline
    >
      <div id="scene" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1">
        <svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{width}} {{height}}"></svg>
      </div>
    </div>
    <script src="assets/kit.js"></script>
{{scripts}}
    <script>
      kit.setup({ fps: {{fps}}, frames: {{frames}} });
      build(new kit.Timing({{timings}}));
      kit.mount(document.getElementById("stage"));
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.fonts = document.fonts.ready;
      window.addEventListener("hf-seek", (event) => kit.render(event.detail.time));
      kit.render(0);
    </script>
  </body>
</html>
